{% extends 'base.html' %}

{% block content %}
<div class="text-center space-y-8 max-w-2xl">
    <div class="space-y-4">
        <h1 class="text-6xl font-black text-gray-900 tracking-tighter">
            Tik<span class="text-indigo-600">Tak</span>Tuk
        </h1>
        <p class="text-xl text-gray-500 font-medium">
            Satu-satunya platform manajemen tiket konser yang gak bikin pusing (janji).
        </p>
    </div>

    <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
        <a href="{% url 'login' %}"
            class="w-full sm:w-48 py-4 bg-indigo-600 text-white font-extrabold rounded-2xl shadow-xl shadow-indigo-200 hover:bg-indigo-700 transition-all text-center">
            LOGIN
        </a>
        <a href="{% url 'register' %}"
            class="w-full sm:w-48 py-4 bg-white text-indigo-600 border-2 border-indigo-50 font-extrabold rounded-2xl hover:bg-indigo-50 transition-all text-center">
            DAFTAR AKUN
        </a>
    </div>

    <div class="pt-12 grid grid-cols-3 gap-8 border-t border-gray-100">
        <div>
            <p class="text-2xl font-black text-gray-900">10k+</p>
            <p class="text-xs font-bold text-gray-400 uppercase">Tiket Terjual</p>
        </div>
        <div>
            <p class="text-2xl font-black text-gray-900">500+</p>
            <p class="text-xs font-bold text-gray-400 uppercase">Event Aktif</p>
        </div>
        <div>
            <p class="text-2xl font-black text-gray-900">100%</p>
            <p class="text-xs font-bold text-gray-400 uppercase">Aman Banget</p>
        </div>
    </div>
</div>
{% endblock %}
