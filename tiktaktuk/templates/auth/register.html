{% extends 'base.html' %}

{% block content %}
<section class="min-h-[80vh] flex items-center justify-center w-full px-4 py-10">
    <div class="w-full max-w-md">

        <div class="text-center mb-6">
            <div
                class="w-12 h-12 bg-blue-600 text-white flex items-center justify-center rounded-xl mx-auto mb-2 text-xl font-bold shadow-md shadow-blue-200">
                TT</div>
            <h1 class="text-2xl font-bold text-slate-900">TikTakTuk</h1>
            <p class="text-slate-500 text-sm">Daftar untuk Memulai</p>
        </div>

        <div id="step-1-role"
            class="bg-white rounded-2xl shadow border border-slate-100 p-6 transition-all duration-300">
            <h2 class="font-semibold text-slate-900">Jenis Pengguna</h2>
            <p class="text-sm text-slate-500 mb-5">Pilih jenis akun yang sesuai dengan kebutuhan Anda</p>

            <button type="button" onclick="showForm('administrator')"
                class="w-full text-left border border-slate-200 rounded-xl p-4 mb-3 hover:border-red-500 hover:bg-red-50 transition cursor-pointer">
                <p class="font-medium text-slate-800">🛡️ Administrator</p>
                <p class="text-sm text-slate-500 mt-1">Kelola seluruh sistem dan data aplikasi</p>
            </button>

            <button type="button" onclick="showForm('customer')"
                class="w-full text-left border border-slate-200 rounded-xl p-4 mb-3 hover:border-blue-500 hover:bg-blue-50 transition cursor-pointer">
                <p class="font-medium text-slate-800">👤 Pelanggan</p>
                <p class="text-sm text-slate-500 mt-1">Beli dan kelola tiket untuk acara favorit Anda</p>
            </button>

            <button type="button" onclick="showForm('organizer')"
                class="w-full text-left border border-slate-200 rounded-xl p-4 hover:border-blue-500 hover:bg-blue-50 transition cursor-pointer">
                <p class="font-medium text-slate-800">🎪 Penyelenggara</p>
                <p class="text-sm text-slate-500 mt-1">Buat dan kelola acara serta venue Anda</p>
            </button>
        </div>

        <div id="step-2-form"
            class="hidden bg-white p-6 rounded-2xl shadow border border-slate-100 transition-all duration-300">
            <button type="button" onclick="backToRoles()"
                class="text-blue-500 text-sm font-medium mb-4 hover:underline">← Kembali</button>
            <h2 id="form-title" class="font-semibold text-slate-900 text-lg">Daftar Akun</h2>
            <p class="text-sm text-slate-500 mb-6">Buat akun baru untuk memulai pengalaman Anda</p>

            <div id="error-banner"
                class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-100">
                <span id="error-message"></span>
            </div>

            <form id="register-form" action="{% url 'register' %}" method="POST" class="space-y-4">
                {% csrf_token %}
                <input type="hidden" name="role_name" id="role_input">

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1" id="label-nama">Nama Lengkap</label>
                    <input type="text" name="full_name" id="input_nama"
                        class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:border-blue-500 focus:outline-none transition placeholder-slate-400"
                        placeholder="Masukkan nama lengkap" required />
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Email</label>
                    <input type="email" name="email"
                        class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:border-blue-500 focus:outline-none transition placeholder-slate-400"
                        placeholder="Masukkan email aktif" required />
                </div>

                <div id="field-phone">
                    <label class="block text-sm font-semibold text-slate-700 mb-1">No. Telepon</label>
                    <input type="tel" name="phone_number" pattern="^\+?[0-9]+$"
                        title="Hanya boleh berisi angka (boleh diawali tanda +)"
                        class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:border-blue-500 focus:outline-none transition placeholder-slate-400"
                        placeholder="Masukkan nomor telepon" required />
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
                    <input type="text" name="username" pattern="[a-zA-Z0-9]+" title="Hanya huruf dan angka tanpa spasi"
                        class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:border-blue-500 focus:outline-none transition placeholder-slate-400"
                        placeholder="Pilih username" required />
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                    <input type="password" name="password"
                        class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:border-blue-500 focus:outline-none transition placeholder-slate-400"
                        placeholder="Minimal 6 karakter" required />
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Konfirmasi Password</label>
                    <input type="password" name="confirm_password"
                        class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:border-blue-500 focus:outline-none transition placeholder-slate-400"
                        placeholder="Ulangi password" required />
                </div>

                <label class="text-sm flex items-start gap-2 pt-2 pb-2 cursor-pointer">
                    <input type="checkbox" required
                        class="mt-1 w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500" />
                    <span class="text-slate-600 leading-tight">Saya setuju dengan <span
                            class="text-blue-600 font-medium">Syarat & Ketentuan</span> TikTakTuk.</span>
                </label>

                <button type="submit" id="submit-btn"
                    class="w-full bg-slate-900 hover:bg-black text-white font-medium py-3 rounded-lg transition">
                    Daftar
                </button>
            </form>
        </div>

        <p class="text-center text-sm mt-6 text-slate-600">
            Sudah punya akun? <a href="{% url 'login' %}" class="text-blue-600 font-semibold hover:underline">Login di
                sini</a>
        </p>
    </div>
</section>

<script>
    function showForm(role) {
        document.getElementById('step-1-role').classList.add('hidden');
        document.getElementById('step-2-form').classList.remove('hidden');
        document.getElementById('role_input').value = role;

        const labelNama = document.getElementById('label-nama');
        const inputNama = document.getElementById('input_nama');
        const fieldPhone = document.getElementById('field-phone');
        const title = document.getElementById('form-title');

        if (role === 'organizer') {
            title.innerText = 'Daftar sebagai Penyelenggara';
            labelNama.innerText = 'Nama Instansi / Organizer';
            inputNama.name = 'organizer_name';
            inputNama.placeholder = 'Masukkan nama instansi';
            fieldPhone.classList.add('hidden');
            fieldPhone.querySelector('input').removeAttribute('required');
        } else if (role === 'administrator') {
            title.innerText = 'Daftar sebagai Administrator';
            labelNama.innerText = 'Nama Admin';
            inputNama.name = 'full_name'; // Disesuaikan dengan struktur DB Admin kamu
            inputNama.placeholder = 'Masukkan nama lengkap';
            fieldPhone.classList.add('hidden');
            fieldPhone.querySelector('input').removeAttribute('required');
        } else {
            // Role Customer
            title.innerText = 'Daftar sebagai Pelanggan';
            labelNama.innerText = 'Nama Lengkap';
            inputNama.name = 'full_name';
            inputNama.placeholder = 'Masukkan nama lengkap';
            fieldPhone.classList.remove('hidden');
            fieldPhone.querySelector('input').setAttribute('required', 'true');
        }
    }

    function backToRoles() {
        document.getElementById('step-2-form').classList.add('hidden');
        document.getElementById('step-1-role').classList.remove('hidden');
        document.getElementById('error-banner').classList.add('hidden');
    }

    document.getElementById('register-form').addEventListener('submit', async function (e) {
        e.preventDefault(); // cegah halaman reload

        const form = this;
        const btn = document.getElementById('submit-btn');
        const errorBanner = document.getElementById('error-banner');
        const errorMsg = document.getElementById('error-message');

        // bikin tombol jadi state loading
        btn.innerText = 'Memproses...';
        btn.disabled = true;
        btn.classList.add('opacity-50', 'cursor-not-allowed');
        errorBanner.classList.add('hidden');

        try {
            const formData = new FormData(form);

            const response = await fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest' // penanda AJAX
                }
            });

            const data = await response.json();

            if (!response.ok) {
                // kalau error (status 400), nampilin teks merah
                errorMsg.innerText = data.error;
                errorBanner.classList.remove('hidden');

                // balikin state tombol
                btn.innerText = 'Daftar';
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                // kalau sukses, lempar ke halaman login
                window.location.href = data.redirect_url;
            }
        } catch (error) {
            console.error('Error:', error);
            errorMsg.innerText = 'Terjadi kesalahan sistem. Silakan coba lagi.';
            errorBanner.classList.remove('hidden');

            btn.innerText = 'Daftar';
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
        }
    });
</script>
{% endblock %}
