{% extends 'base.html' %}

{% block content %}
<div class="w-full max-w-lg">
    <div class="bg-white p-10 rounded-[2rem] shadow-xl shadow-indigo-100/50 border border-gray-50">
        <h2 class="text-3xl font-extrabold text-center text-gray-900 mb-2">Daftar Akun</h2>
        <p class="text-center text-gray-400 mb-10">Pilih jenis akun untuk melanjutkan</p>

        <form action="{% url 'register' %}" method="POST" class="space-y-6">
            {% csrf_token %}

            <div class="grid grid-cols-2 gap-4">
                <label class="relative group">
                    <input type="radio" name="role_name" value="customer" class="peer hidden" checked
                        onchange="updateForm()">
                    <div
                        class="p-4 border-2 border-gray-100 rounded-2xl text-center cursor-pointer peer-checked:border-indigo-600 peer-checked:bg-indigo-50 transition-all">
                        <span class="block font-bold text-gray-700 peer-checked:text-indigo-600 text-sm">CUSTOMER</span>
                    </div>
                </label>
                <label class="relative group">
                    <input type="radio" name="role_name" value="organizer" class="peer hidden" onchange="updateForm()">
                    <div
                        class="p-4 border-2 border-gray-100 rounded-2xl text-center cursor-pointer peer-checked:border-indigo-600 peer-checked:bg-indigo-50 transition-all">
                        <span
                            class="block font-bold text-gray-700 peer-checked:text-indigo-600 text-sm">ORGANIZER</span>
                    </div>
                </label>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-8">
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-2 ml-1">Username</label>
                    <input type="text" name="username"
                        class="w-full px-5 py-3 rounded-xl bg-gray-50 border-2 border-transparent focus:border-indigo-500 focus:bg-white outline-none transition-all"
                        required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-2 ml-1">Email</label>
                    <input type="email" name="email"
                        class="w-full px-5 py-3 rounded-xl bg-gray-50 border-2 border-transparent focus:border-indigo-500 focus:bg-white outline-none transition-all"
                        required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-2 ml-1">Password</label>
                    <input type="password" name="password"
                        class="w-full px-5 py-3 rounded-xl bg-gray-50 border-2 border-transparent focus:border-indigo-500 focus:bg-white outline-none transition-all"
                        required>
                </div>

                <div id="customer-fields" class="md:col-span-2 space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-2 ml-1">Nama Lengkap</label>
                        <input type="text" name="full_name"
                            class="w-full px-5 py-3 rounded-xl bg-gray-50 border-2 border-transparent focus:border-indigo-500 focus:bg-white outline-none transition-all">
                    </div>
                </div>

                <div id="organizer-fields" class="md:col-span-2 space-y-4 hidden">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-2 ml-1">Nama Organizer</label>
                        <input type="text" name="organizer_name"
                            class="w-full px-5 py-3 rounded-xl bg-gray-50 border-2 border-transparent focus:border-indigo-500 focus:bg-white outline-none transition-all">
                    </div>
                </div>
            </div>

            <button type="submit"
                class="w-full py-4 bg-indigo-600 text-white font-extrabold rounded-2xl hover:bg-indigo-700 transition-all shadow-lg">
                DAFTAR SEKARANG
            </button>
        </form>
    </div>
</div>

<script>
    function updateForm() {
        const role = document.querySelector('input[name="role_name"]:checked').value;
        document.getElementById('customer-fields').classList.toggle('hidden', role !== 'customer');
        document.getElementById('organizer-fields').classList.toggle('hidden', role !== 'organizer');
    }
</script>
{% endblock %}
