{% extends 'base.html' %}

{% block content %}
<section class="min-h-[80vh] flex items-center justify-center w-full px-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-6">
            <div
                class="w-12 h-12 bg-blue-600 text-white flex items-center justify-center rounded-xl mx-auto mb-2 text-xl font-bold shadow-md shadow-blue-200">
                TT</div>
            <h1 class="text-2xl font-bold text-slate-900">TikTakTuk</h1>
            <p class="text-slate-500 text-sm">Platform Manajemen Pertunjukan & Tiket</p>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow border border-slate-100">
            <h2 class="font-semibold text-slate-900 mb-1">Masuk ke Akun Anda</h2>
            <p class="text-sm text-slate-500 mb-6">Gunakan kredensial Anda untuk mengakses platform</p>

            {% if error %}
            <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-100">
                {{ error }}
            </div>
            {% endif %}

            <form action="{% url 'login' %}" method="POST" class="space-y-4">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Username / Email</label>
                    <input type="text" name="identifier"
                        class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:border-blue-500 focus:outline-none transition placeholder-slate-400"
                        placeholder="Masukkan username atau email" required />
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                    <input type="password" name="password"
                        class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:border-blue-500 focus:outline-none transition placeholder-slate-400"
                        placeholder="Masukkan password" required />
                </div>

                <button type="submit"
                    class="w-full bg-slate-900 hover:bg-black text-white font-medium py-3 rounded-lg transition mt-2">
                    Masuk
                </button>
            </form>
        </div>

        <p class="text-center text-sm mt-6 text-slate-600">
            Belum punya akun? <a href="{% url 'register' %}" class="text-blue-600 font-semibold hover:underline">Daftar
                sekarang</a>
        </p>
    </div>
</section>
{% endblock %}
