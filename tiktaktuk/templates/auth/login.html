{% extends 'base.html' %}

{% block content %}
<div class="w-full max-w-md">
    <div class="bg-white p-10 rounded-[2rem] shadow-xl shadow-indigo-100/50 border border-gray-50">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-extrabold text-gray-900">Selamat Datang</h2>
            <p class="text-gray-400 mt-2">Masuk ke akun TikTakTuk Anda</p>
        </div>

        {% if error %}
        <div class="bg-red-50 text-red-600 p-4 rounded-xl text-sm font-medium mb-6 text-center border border-red-100">
            {{ error }}
        </div>
        {% endif %}

        <form action="{% url 'login' %}" method="POST" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-2 ml-1">Username / Email</label>
                <input type="text" name="identifier"
                    class="w-full px-5 py-4 rounded-2xl bg-gray-50 border-2 border-transparent focus:border-indigo-500 focus:bg-white outline-none transition-all"
                    placeholder="Masukkan identifier" required>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-2 ml-1">Password</label>
                <input type="password" name="password"
                    class="w-full px-5 py-4 rounded-2xl bg-gray-50 border-2 border-transparent focus:border-indigo-500 focus:bg-white outline-none transition-all"
                    placeholder="••••••••" required>
            </div>
            <button type="submit"
                class="w-full py-4 bg-indigo-600 text-white font-extrabold rounded-2xl hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-200">
                MASUK SEKARANG
            </button>
        </form>
        <p class="text-center mt-8 text-sm text-gray-500">
            Belum punya akun? <a href="{% url 'register' %}" class="text-indigo-600 font-bold hover:underline">Daftar di
                sini</a>
        </p>
    </div>
</div>
{% endblock %}
