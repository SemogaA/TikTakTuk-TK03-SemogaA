{% extends 'base.html' %}

{% block content %}
<div class="fixed inset-0 bg-slate-900/40 z-40 backdrop-blur-sm flex items-center justify-center px-4">
    
    <div class="bg-white rounded-3xl w-full max-w-[480px] shadow-2xl overflow-hidden z-50">
        
        <div class="px-6 py-5 flex justify-between items-center border-b border-slate-100">
            <h2 class="text-[1.15rem] font-black text-slate-800">
                {% if artist %}Edit Artis{% else %}Tambah Artis Baru{% endif %}
            </h2>
            <a href="{% url 'artist_list' %}" class="text-slate-400 hover:text-slate-600 transition" title="Tutup">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </a>
        </div>

        <form method="POST" action="" class="p-6">
            {% csrf_token %}
            
            {% if error %}
            <div class="mb-5 p-3 bg-rose-50 text-rose-600 text-sm font-medium rounded-xl border border-rose-100 flex items-start gap-2">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <div class="space-y-5">
                <div>
                    <label class="block text-[11px] font-black text-slate-500 uppercase tracking-widest mb-2">
                        Nama Artis <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" name="name" required value="{{ artist.name|default:'' }}"
                        class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm font-medium text-slate-800 transition"
                        placeholder="cth. Fourtwnty">
                </div>

                <div>
                    <label class="block text-[11px] font-black text-slate-500 uppercase tracking-widest mb-2">
                        Genre
                    </label>
                    <input type="text" name="genre" value="{{ artist.genre|default:'' }}"
                        class="w-full px-4 py-3 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm font-medium text-slate-800 transition"
                        placeholder="cth. Indie Folk">
                </div>
            </div>

            <div class="mt-8 flex justify-center gap-3">
                <a href="{% url 'artist_list' %}" class="flex-1 text-center py-3 rounded-full border border-slate-200 text-slate-700 font-bold hover:bg-slate-50 transition text-sm">
                    Batal
                </a>
                <button type="submit" class="flex-1 text-center py-3 rounded-full bg-blue-600 text-white font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-600/20 text-sm">
                    {% if artist %}Simpan Perubahan{% else %}Tambah Artis{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
