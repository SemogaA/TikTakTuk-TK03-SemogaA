{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto mt-10 px-4">
    <div class="bg-white shadow-md rounded-lg border border-slate-200 overflow-hidden">
        
        <div class="bg-[#333C4C] px-6 py-4 border-b border-slate-200">
            <h2 class="text-xl font-bold text-[#ECF1EA]">
                {% if artist %}Edit Data Artis{% else %}Tambah Artis Baru{% endif %}
            </h2>
        </div>

        <div class="p-6">
            {% if error %}
            <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-200">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="">
                {% csrf_token %}
                
                <div class="mb-5">
                    <label for="name" class="block text-sm font-semibold text-slate-700 mb-2">Nama Artis <span class="text-red-500">*</span></label>
                    <input type="text" id="name" name="name" required
                           value="{{ artist.name|default:'' }}"
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#333C4C] focus:border-[#333C4C] outline-none transition"
                           placeholder="Masukkan nama artis...">
                </div>

                <div class="mb-6">
                    <label for="genre" class="block text-sm font-semibold text-slate-700 mb-2">Genre Musik</label>
                    <input type="text" id="genre" name="genre" 
                           value="{{ artist.genre|default:'' }}"
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#333C4C] focus:border-[#333C4C] outline-none transition"
                           placeholder="Contoh: Pop, Rock, Jazz (Opsional)">
                </div>

                <div class="flex justify-end gap-3 pt-2 border-t border-slate-100">
                    <a href="{% url 'artist_list' %}" class="px-5 py-2 rounded-lg text-sm font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition">
                        Batal
                    </a>
                    <button type="submit" class="px-5 py-2 rounded-lg text-sm font-semibold text-[#ECF1EA] bg-[#333C4C] hover:bg-slate-800 transition shadow-sm">
                        Simpan Data
                    </button>
                </div>
            </form>
        </div>
        
    </div>
</div>
{% endblock %}
