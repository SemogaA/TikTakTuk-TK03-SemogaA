<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikTakTuk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-200 text-slate-800 min-h-screen flex flex-col">

    {% if username %}
    <nav class="bg-white border-b border-slate-300 px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <div
                class="w-8 h-8 bg-blue-600 text-white flex items-center justify-center rounded-lg text-xs font-bold tracking-tighter">
                TT</div>
            <a href="{% url 'dashboard' %}" class="font-bold text-lg text-slate-900">TikTakTuk</a>
        </div>

        <div class="flex items-center gap-4 text-sm">
            <span class="text-slate-800 font-semibold">{{ username }}</span>
            <div class="w-px h-5 bg-slate-300"></div>
            <a href="{% url 'logout' %}" class="text-red-600 hover:text-red-800 font-bold transition">Logout</a>
        </div>
    </nav>
    {% endif %}

    <main class="flex-grow flex flex-col">
        {% block content %}{% endblock %}
    </main>

</body>

</html>
