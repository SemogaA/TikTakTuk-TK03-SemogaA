{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto mt-10 px-4">
    <div class="bg-white shadow-md rounded-xl border border-slate-200 overflow-hidden">
        <div class="bg-[#333C4C] px-6 py-4">
            <h2 class="text-xl font-bold text-[#ECF1EA]">
                {% if category %}Edit Kategori Tiket{% else %}Tambah Kategori Tiket{% endif %}
            </h2>
        </div>

        <form method="POST" class="p-6 space-y-5">
            {% csrf_token %}
            
            {% if error %}
            <div class="p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm">
                {{ error }}
            </div>
            {% endif %}

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Kategori</label>
                <input type="text" name="category_name" value="{{ category.category_name }}" required
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="Contoh: VIP, Reguler, Early Bird">
            </div>

            {% if not category %}
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Target Event ID</label>
                <input type="text" name="tevent_id" required
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="Masukkan UUID Event">
                <p class="text-xs text-slate-400 mt-1 italic">*Kategori tiket terikat secara permanen pada satu event.</p>
            </div>
            {% endif %}

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Harga (Rp)</label>
                    <input type="number" name="price" value="{{ category.price }}" required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="0">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Kuota Tiket</label>
                    <input type="number" name="quota" value="{{ category.quota }}" required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        placeholder="Jumlah tiket">
                </div>
            </div>

            <div class="pt-4 flex items-center justify-end gap-3 border-t border-slate-100">
                <a href="{% url 'category_list' %}" class="text-slate-500 hover:text-slate-700 font-medium text-sm">Batal</a>
                <button type="submit" class="bg-[#333C4C] hover:bg-slate-800 text-[#ECF1EA] px-6 py-2 rounded-lg font-bold transition shadow-md">
                    {% if category %}Simpan Perubahan{% else %}Buat Kategori{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
